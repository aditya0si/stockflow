name: ci

on:
  push:
  pull_request:

jobs:
  go:
    name: format, vet, tests, race, demo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STOCKFLOW_TEST_DATABASE_URL: postgres://stockflow:stockflow@localhost:5432/stockflow_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: formatting
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test -count=1 ./internal/...

      - name: integration tests
        run: go test -count=1 ./tests/...

      - name: deterministic demo
        env:
          STOCKFLOW_ALLOW_DEMO_FIXTURES: "true"
        run: go run ./cmd/demo

      - name: race detector
        run: go test -race -count=1 ./...

  web:
    name: format, typecheck, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: formatting
        run: npm run format:check

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm test

      - name: build
        run: npm run build
