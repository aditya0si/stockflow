name: ci

on:
  push:
  pull_request:

jobs:
  go:
    name: format, vet, tests, race, demo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STOCKFLOW_TEST_DATABASE_URL: postgres://stockflow:stockflow@localhost:5432/stockflow_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: formatting
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test -count=1 ./internal/...

      - name: integration tests
        run: go test -count=1 ./tests/...

      - name: deterministic demo
        env:
          STOCKFLOW_ALLOW_DEMO_FIXTURES: "true"
        run: go run ./cmd/demo

      - name: race detector
        run: go test -race -count=1 ./...

      - name: backup/restore rehearsal
        if: always()
        env:
          STOCKFLOW_BACKUP_DIRECT: "1"
          STOCKFLOW_BACKUP_DB: stockflow_test
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: stockflow
          PGPASSWORD: stockflow
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash scripts/backup-restore-test.sh 2>&1 | tee artifacts/backup-restore-rehearsal.log

      - name: upload backup/restore rehearsal log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-rehearsal-log
          path: artifacts/backup-restore-rehearsal.log
          if-no-files-found: error

  web:
    name: format, typecheck, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: formatting
        run: npm run format:check

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm test

      - name: build
        run: npm run build

  e2e:
    name: docker build, compose, playwright + axe
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: build and start the production stack
        run: docker compose up -d --build

      - name: wait for application readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz >/dev/null; then
              echo "application ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "application did not become ready"
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install web dependencies
        working-directory: web
        run: npm ci

      - name: install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Playwright and axe (fails on browser console/page/request errors)
        working-directory: web
        run: npx playwright test

      - name: upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

      - name: compose logs on failure
        if: failure()
        run: docker compose logs

      - name: stop the stack
        if: always()
        run: docker compose down -v
