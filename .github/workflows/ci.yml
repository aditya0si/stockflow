name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: format, vet, tests, race
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STOCKFLOW_TEST_DATABASE_URL: postgres://stockflow:stockflow@localhost:5432/stockflow_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: formatting
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test -count=1 ./internal/...

      - name: integration tests
        run: go test -count=1 ./tests/...

      - name: race detector
        run: go test -race -count=1 ./...
